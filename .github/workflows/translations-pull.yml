# Pull down translations from Crowdin every two hours or when triggered manually.

name: 'Pull translations'

# NO cron. This job is `runs-on: ubuntu-latest` and CI here is native on
# git.hanzo.ai, which has no such runner — an unmatched label does not error on
# this forge, it QUEUES until the job is cancelled. Every two hours it produced
# a job that could not start and reported nothing: 12 stuck in a day.
#
# Dispatch and workflow_call stay, so pulling translations is still one click
# when somebody wants it. Give it a runner from our own pool (lux-build-amd64)
# before putting a schedule back.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pull_translations:
    name: Pull translations
    runs-on: ubuntu-latest
    environment: Translations
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-install

      - name: Compile translations
        id: compile_translations
        run: npm run translate:compile -- -- --strict
        continue-on-error: true

      - name: Pull translations from Crowdin
        if: steps.compile_translations.outcome == 'failure'
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          export_only_approved: false
          localization_branch_name: chore/translations
          commit_message: 'chore: add translations'
          pull_request_title: 'chore: add translations'

        env:
          # A classic GitHub Personal Access Token with the 'repo' scope selected (the user should have write access to the repository).
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

          # A numeric ID, found at https://crowdin.com/project/<projectName>/tools/api
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}

          # Visit https://crowdin.com/settings#api-key to create this token
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
